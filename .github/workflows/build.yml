name: Build Devgent Executable

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (Run workflow button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Devgent-windows
          - os: ubuntu-latest
            artifact_name: Devgent-linux
          - os: macos-latest
            artifact_name: Devgent-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Install C Compilers & System Libraries
      - name: Install C Compiler & Qt6 Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ ccache libgl1-mesa-dev libegl1-mesa libxkbcommon-x11-0

      - name: Set up MSVC Compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Note: macOS runners already have Apple Clang / Xcode tools pre-installed.

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install PyQt6 requests markdown2 python-docx openpyxl pypdf reportlab python-pptx google-genai

      # Enable Compiler Cache for faster subsequent builds
      - name: Setup CCache for Nuitka
        uses: Nuitka-actions/with-ccache@v2

      # Build with Nuitka
      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyqt6 \
            --windows-console-mode=disable \
            --assume-yes-for-downloads \
            --jobs=max \
            --output-dir=build \
            AIAgent.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.exe
            build/AIAgent.bin
            build/AIAgent
          if-no-files-found: error
