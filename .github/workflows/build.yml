name: Build Devgent Executable

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (Run workflow button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Devgent-windows
            binary_glob: build/AIAgent.dist/**
          - os: ubuntu-latest
            artifact_name: Devgent-linux
            binary_glob: build/AIAgent.dist/**
          - os: macos-latest
            artifact_name: Devgent-macos
            binary_glob: build/AIAgent.dist/**

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install C compiler for Nuitka across platforms
      - name: Install C Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Note: macOS-latest runners already have Xcode Command Line Tools / Clang pre-installed.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install PyQt6 requests markdown2 python-docx openpyxl pypdf reportlab python-pptx google-genai

      # --standalone: bundle everything needed to run, no system Python required
      # --onefile: pack it into a single executable file
      # --enable-plugin=pyqt6: teach Nuitka how to handle PyQt6 correctly
      # --windows-console-mode=disable: no background console window (Windows only, harmless elsewhere)
      # --assume-yes-for-downloads: let Nuitka fetch its helper tools (like MinGW on Windows if MSVC isn't used) automatically
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyqt6 --windows-console-mode=disable --assume-yes-for-downloads --output-dir=build AIAgent.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.exe
            build/AIAgent.bin
            build/AIAgent
          if-no-files-found: ignore
